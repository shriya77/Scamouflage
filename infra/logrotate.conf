# Used by infra/maintenance.sh (as linux1, with its own state file). @DATA@ = the data folder.
# copytruncate: the consumer/stream keep their file open, so copy then truncate in place.
@DATA@/consumer.log @DATA@/stream.log @DATA@/cpacf.log @DATA@/api.log @DATA@/maintenance.log @DATA@/*.supervise.log {
    size 100M
    rotate 3
    compress
    missingok
    notifempty
    copytruncate
}
