<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scamouflage</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <span class="title">Scamouflage</span>
    <span id="demo-pill" class="pill" hidden>DEMO MODE</span>
  </header>

  <section id="status" class="status status-loading">
    <div id="status-title" class="status-title">Checking…</div>
    <div id="status-host" class="status-host"></div>
    <div id="status-detail" class="status-detail"></div>
    <ul id="status-reasons" class="status-reasons" hidden></ul>
  </section>

  <dl class="list-info">
    <dt>Entries in list</dt><dd id="entry-count">–</dd>
    <dt>Last successful sync</dt><dd id="last-sync">–</dd>
    <dt>List source</dt><dd id="list-source">–</dd>
  </dl>
  <p id="sync-error" class="sync-error" hidden></p>

  <div class="buttons">
    <button id="sync-now" type="button">Sync now</button>
    <a id="dashboard" href="#">TollTrap dashboard</a>
  </div>

  <footer>
    <a id="options" href="#">Settings</a>
    <span class="privacy">Checks happen in your browser. Sites you visit are never sent anywhere.</span>
  </footer>

  <script src="config.js"></script>
  <script src="matcher.js"></script>
  <script src="popup.js"></script>
</body>
</html>
